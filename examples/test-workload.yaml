---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-minikube-test
  namespace: default
  labels:
    app: nginx-minikube-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-minikube-test
  template:
    metadata:
      labels:
        app: nginx-minikube-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-minikube-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: nginx-minikube-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31080
