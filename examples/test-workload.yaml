---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-microk8s-test
  namespace: default
  labels:
    app: nginx-microk8s-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-microk8s-test
  template:
    metadata:
      labels:
        app: nginx-microk8s-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-microk8s-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nginx-microk8s-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
