---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rke2-test
  namespace: default
  labels:
    app: nginx-rke2-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-rke2-test
  template:
    metadata:
      labels:
        app: nginx-rke2-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-rke2-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nginx-rke2-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-rke2-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: rke2.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-rke2-service
                port:
                  number: 80
